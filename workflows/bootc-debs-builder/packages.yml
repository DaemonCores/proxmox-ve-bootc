# Package manifest for the bootc .deb builder.
# One entry per package CLASS (Gabriel spec 2026-10-30): the variants
# mechanism (same as the kernel entries) expands one build script across
# every package of the class — zero duplicated YAML. Downstream, the
# manifest-expand action resolves each variant into a plain package entry.
#
# Shared deb logic: DaemonCores-CI scripts/deb_helpers.sh, imported
# implicitly (strict mode enforced by build-deb.sh: -euo pipefail) by build-deb.sh (once, for every build) — no helper plumbing
# appears in the build blocks. The overlay model: package dirs mirror the deb tree
# (variant-source: "{variant}" hashes each mirror); modified upstream files
# are git .patch at the mirrored path; all-or-nothing dry-run first; .patch
# is never shipped. Drift = the deb build is skipped, the last-good deb is
# retained by build-deb.sh.
#
# HELPERS_VER is hashed per entry; bump it whenever the DaemonCores-CI deb
# helpers change (other repository, invisible to the content hash).
packages:
  - name: repacked
    variant-env: PKG
    variant-source: "{variant}"
    env:
      HELPERS_VER: 6
    build: |
      deb_repack "${PKG}" "${VER_SUFFIX}" "${PKG}"
    deb-glob: "{variant}_*"
    variants:
      libtemplate-perl:
        env:
          PKG: libtemplate-perl
          VER_SUFFIX: +bootc1
      libpve-storage-perl:
        env:
          PKG: libpve-storage-perl
          VER_SUFFIX: +bootc1
      pve-manager:
        env:
          PKG: pve-manager
          VER_SUFFIX: +bootc1
      qemu-server:
        env:
          PKG: qemu-server
          VER_SUFFIX: +bootc1
      proxmox-kernel-helper:
        env:
          PKG: proxmox-kernel-helper
          VER_SUFFIX: +bootc1
        upstream: proxmox-kernel-helper

  # class upstream-all: publishes the UNMODIFIED upstream deb of an
  # Architecture: all package, resolved dynamically from the amd64 PVE index
  # (no pinned version). The repacked class carries dependency floors cut
  # against that index (libpve-storage-perl depends on libpve-common-perl
  # (>= 9.2.3), pve-manager since 9.2.25 on libpve-cluster-api-perl
  # (>= 9.1.8), which itself exact-depends libpve-cluster-perl (= 9.1.8)),
  # while the Proxmox arm64 index lags the amd64 one for the
  # arch-independent packages both publish (measured 2026-11-02:
  # libpve-common-perl arm64 topped out at 9.2.2, amd64 at 9.2.5; measured
  # 2026-11-03: libpve-cluster-api-perl arm64 at 9.1.6, amd64 at 9.1.8 —
  # the arm64 image build then failed the floor, run 41614002966). The
  # package is Architecture: all, so the amd64-index deb is exactly what
  # the arm64 image needs; publishing it into the shared APT repo (whose
  # index mirrors arch-independent debs into every arch) satisfies the
  # floor for both image arches. On amd64 the registration below is a no-op
  # and the candidate is the native index's own copy — one build, both
  # arches. No repack: the deb keeps its upstream version string (no epoch,
  # no revision) so it cannot diverge from the upstream package it mirrors.
  - name: upstream-all
    variant-env: UPSTREAM_PKG
    variant-source: "{variant}"
    env:
      # Index arch to resolve across, registered as a dpkg foreign
      # architecture in the build (a no-op when it already is the native
      # one). The PVE apt source itself is the preinstalled
      # pve-no-subscription source — no URL belongs in this manifest.
      UPSTREAM_ARCH: amd64
    build: |
      # Registering the discovery arch puts that arch's index into the arch
      # list apt consults; plain-name resolution then picks the newest
      # candidate across all registered indexes.
      dpkg --add-architecture "${UPSTREAM_ARCH}"
      apt-get update

      # Plain name on purpose: a "${UPSTREAM_PKG}:${UPSTREAM_ARCH}" request
      # has no candidate for an Architecture: all entry — the all variant
      # only resolves across the arch list under the plain name (measured
      # 2026-11-02 on trixie).
      cd /tmp
      apt-get download "${UPSTREAM_PKG}"

      # The glob part must stay OUTSIDE the quotes: bash never expands a
      # glob inside "...", and dpkg-deb would receive the literal asterisk.
      set -- "/tmp/${UPSTREAM_PKG}"_*.deb
      [ -f "${1:-}" ] \
        || { echo "ERROR: no upstream .deb for ${UPSTREAM_PKG} left in /tmp after download" >&2; exit 1; }

      # Publish an arch-independent deb only: an arch-specific copy
      # resolved here would be unusable by the other arch's index.
      if [ "$(dpkg-deb -f "${1}" Architecture)" != "all" ]; then
        echo "ERROR: ${UPSTREAM_PKG} upstream deb is not Architecture: all; refusing to publish it" >&2
        exit 1
      fi

      # Verbatim bits, upstream filename and version: nothing to rebuild.
      cp -v "${1}" /debs/
      echo "published ${UPSTREAM_PKG} $(dpkg-deb -f "${1}" Version) from the ${UPSTREAM_ARCH} index"
    deb-glob: "{variant}_*"
    variants:
      libpve-common-perl:
        env:
          UPSTREAM_PKG: libpve-common-perl
        upstream: libpve-common-perl
      libpve-cluster-api-perl:
        env:
          UPSTREAM_PKG: libpve-cluster-api-perl
        upstream: libpve-cluster-api-perl
      libpve-cluster-perl:
        env:
          UPSTREAM_PKG: libpve-cluster-perl
        upstream: libpve-cluster-perl
      libpve-notify-perl:
        env:
          UPSTREAM_PKG: libpve-notify-perl
        upstream: libpve-notify-perl
      ifupdown2:
        env:
          UPSTREAM_PKG: ifupdown2
        upstream: ifupdown2

  # class overlay-tree: repack of an upstream package with a plain overlay
  # tree on top (fixes and drop-ins only — the DaemonCores-VE fork owns its
  # own overlay builds for the fork-only bits, e.g. the ifupdown2
  # autoconf/domain-set exec tools: the vanilla ifupdown2 is the UNMODIFIED
  # upstream deb, published by the upstream-all class above).
  - name: overlay-tree
    variant-env: PKG
    variant-source: "{variant}"
    env:
      HELPERS_VER: 7
    build: |
      deb_overlay_tree "${PKG}" "${VER_SUFFIX}" "${PKG}" ${EXTRA_EXEC:-}
    deb-glob: "{variant}_*"
    variants:
      chrony:
        env:
          PKG: chrony
          VER_SUFFIX: +bootc2
        upstream: chrony
      openipmi:
        env:
          PKG: openipmi
          VER_SUFFIX: +bootc1
        upstream: openipmi

  # ===========================================================================
  # kernel-pve REMOVED (owner FINAL architecture, 05/11 13:0x, owner order
  # 16:2x): the vanilla lane builds NO kernel and NO NVIDIA pair any more —
  # the unified kernel (14 IA/VM profile lanes) and the linux-headers debs
  # live on the debian side (debian-bootc linux-image-profile /
  # linux-modules-nvidia); the lane-local kernel-pve/kconfig sur-rides and
  # the engine kernel export refs died with the entry (the helper env var left with it).
  # The vanilla keeps ONLY the OpenZFS module pair below, built through the
  # SHARED kernel_build_module gate of DaemonCores-CI against the published
  # linux-headers deb of the unified kernel.
  - name: source-build
    variant-env: PKG
    variant-source: "{variant}-src"
    env:
      HELPERS_VER: 6
    build: |
      deb_source_build "${PKG}" "${UP_COMMIT}" "${SRC_VER}" "${PKG}-src" pve-cluster libpve-cluster-api-perl
    deb-glob: "{variant}_*"
    variants:
      pve-cluster:
        env:
          PKG: pve-cluster
          UP_COMMIT: 66c87e0e7587a247f879f6f59e3bb5f3dd008e1f
          SRC_VER: 9.1.7.1+bootc1

  # ZFS MODULE — STANDALONE BUILDER (owner order 05/11 08:5x + correction
  # 08:57). The unified mainline 7.2 tree carries no zfs module (the PVE
  # packaging builds it from the zfsonlinux submodule, OUT of this build
  # path): the pools on the PVE hosts are intact, only the kernel modules
  # miss. One entry, NO kernel recompile, NO DKMS: the builder downloads
  # the flavour's published linux-headers deb from this repo's APT on
  # Pages (module-ready tree: auto.conf/autoconf.h/utsrelease +
  # Module.symvers), builds the OpenZFS modules against it and ships
  # zfs-module-pve-<flavour>. Dispatched ALONE via the pipeline's
  # only_deb filter (= zfs-module-pve) — the kernel entry is untouched.
  # Version rule (owner 08:5x + correction 08:56/08:57 + BUILD fail proof):
  # the tag must support THE RESOLVED KERNEL first, match the userspace
  # second. zfs-2.3.4 hard-rejects the 7.2.15 tree (its META Linux-Maximum
  # = 6.16 — configure3 run, live), so ZFS_TAG pins zfs-2.4.4 (Linux-Maximum
  # = 7.2, first release covering the 7.x PVE line; master is 7.3 but
  # rolling). USERSPACE doctrine: the host zfsutils-linux stays 2.3.x-pve1
  # (PVE trixie index) — a module NEWER than the utils is the tolerated
  # direction (OpenZFS ABI: userland ioctls are backward compatible across
  # the 2.3 → 2.4 major), the REVERSE is not; the control floors zfsutils
  # only at 2.3~ and the host utils are NOT upgraded. On the host return,
  # `zfs version` via the relay re-checks the pair and the tag is repinned
  # only for a NEWER-utils mismatch. NO DKMS. Dispatched ALONE via the
  # pipeline's only_deb filter (= zfs-module-pve) — the VER 9 kernel entry
  # (and its content hash / cache) is untouched.
  - name: zfs-module-pve
    env:
      ZFS_TAG: "zfs-2.4.4"
      ZFS_DEB_VER: "2.4.4-1"
    # NO variant-deps any more (owner FINAL architecture 05/11 13:0x): the
    # kernel-pve entry is gone, the headers come from the PUBLISHED APT index
    # below (the unified kernel debs feed this repo's index from the debian
    # side publish). /tmp/prior stays supported when an orchestrator feeds
    # prior-wave kernel debs; without them the published index is the source.
    build: |
      FLAV="${VARIANT}"
      test -n "${FLAV}" \
        || { echo "ERROR: zfs-module-pve needs a flavour variant" >&2; exit 1; }
      echo "zfs-module-pve: block entered (flavour ${FLAV})"
      mkdir -p /build /debs
      # The published APT index the headers (and the kernel-seed deb) come
      # from: the DEBIAN side pages by default — THIS repo's index carries no
      # kernel debs any more (owner FINAL architecture). PAGES_URL overrides
      # for an orchestrator that mirrors the kernel debs.
      BASE="${PAGES_URL:-https://daemoncores.github.io/debian-bootc}"
      BASE="${BASE%/}"

      # HEADERS SOURCE (owner FINAL architecture 05/11 13:0x): the kernel-pve
      # entry is gone, so there is NO intra-run wave any more — the headers
      # are the PUBLISHED linux-headers deb of the unified kernel on the
      # DEBIAN side APT index (BASE above; proven live 09/11: this repo's
      # own index carries zero kernel packages). /tmp/prior stays supported
      # when an orchestrator feeds prior-wave kernel debs (the -pve
      # spelling is a transition fallback only).
      HDR_DEB=""
      for d in /tmp/prior/linux-headers-*"${FLAV}"*-xanmod1_*.deb; do
        [[ -e ${d} ]] || continue
        HDR_DEB="${d}"
        break
      done
      HDR_NAME=""
      test -n "${HDR_DEB}" \
        || for d in /tmp/prior/linux-headers-*"${FLAV}"*-xanmod1-pve_*.deb; do
          [[ -e ${d} ]] || continue
          HDR_DEB="${d}"
          break
        done
      if test -n "${HDR_DEB}"; then
        cp -- "${HDR_DEB}" /build/headers.deb
        HDR_NAME="$(dpkg-deb -f /build/headers.deb Package)"
      else
        # HEADERS live on the DEBIAN side publish (see BASE above); an
        # orchestrator's PAGES_URL override is already folded into BASE.
        IDX="${BASE}/dists/trixie/main/binary-amd64/Packages"
        echo "zfs-module-pve: reading the APT index ${IDX}"
        curl -fsSL "${IDX}" -o /build/Packages \
          || { echo "ERROR: cannot read the APT index ${IDX}" >&2; exit 1; }
        # PROFILES first (owner 05/11 midi: the profile identity lives in the
        # packaging — the headers Package carries the profile infix while the
        # tree keeps the SHARED UTS release). The PVE host kernel = the VM
        # profile (THP never), so prefer linux-headers-vm-<flav> explicitly;
        # the generic aligned fallback and the legacy -pve tree follow.
        HDR_NAME=$(awk '$1=="Package:" && $2 ~ /^linux-headers-/ {p=$2}
          p ~ /^linux-headers-vm-.*-'"${FLAV}"'-xanmod1$/ {print p}' /build/Packages \
          | sort -rV | head -1)
        test -n "${HDR_NAME}" \
          || HDR_NAME=$(awk '$1=="Package:" && $2 ~ /^linux-headers-/ {p=$2}
            p ~ /-'"${FLAV}"'-xanmod1$/ {print p}' /build/Packages \
            | sort -rV | head -1)
        test -n "${HDR_NAME}" \
          || HDR_NAME=$(awk '$1=="Package:" && $2 ~ /^linux-headers-/ {p=$2}
            p ~ /-'"${FLAV}"'-xanmod1-pve$/ {print p}' /build/Packages | head -1)
        echo "zfs-module-pve: headers selected: ${HDR_NAME:-<none>}"
        test -n "${HDR_NAME}" \
          || { echo "ERROR: no linux-headers for flavour ${FLAV} in the APT index ${IDX}" >&2; exit 1; }
      fi
      # Filename of a package stanza, resolved by NAME (the deb file name is
      # NOT derived from the package name: the headers are republished as
      # linux-headers${SUFFIX}_${VER}_${arch}.deb). Reset on the blank line
      # between stanzas so a match never leaks into the next entry.
      _filename_by_pkg() {
        awk -v want="$1" '$0 == "" {getf=0}
          getf && $1 == "Filename:" {print $2; getf=0; exit}
          $1 == "Package:" && $2 == want {getf=1}' "${2:-/build/Packages}"
      }
      curl -fsSL "${BASE}/$(_filename_by_pkg "${HDR_NAME}")" -o /build/headers.deb \
        || { echo "ERROR: cannot download ${HDR_NAME}" >&2; exit 1; }
      # The profile lane names the headers Package linux-headers-<profile>-<UTS>
      # while the tree inside keeps the SHARED release string (the profile
      # identity lives in the packaging only — owner 05/11 midi). Parse the
      # profile off the package name; KVER stays the UTS release.
      HDR_PKG=$(dpkg-deb -f /build/headers.deb Package)
      HDR_PROFILE=""
      case "${HDR_PKG}" in
        linux-headers-vm-*) HDR_PROFILE=vm ;;
        linux-headers-ia-*) HDR_PROFILE=ia ;;
      esac
      KVER="${HDR_PKG#linux-headers-}"
      KVER="${KVER#${HDR_PROFILE}-}"
      SRC="intra-run dep deb (${HDR_DEB})"
      test -n "${HDR_DEB}" || SRC="published APT index (${BASE})"
      echo "zfs-module-pve: building against ${KVER} (${SRC})"

      apt-get update >/dev/null
      apt-get install -y --no-install-recommends \
        autoconf automake libtool build-essential bc libelf-dev >/dev/null

      rm -rf /build/sys && mkdir -p /build/sys
      dpkg-deb -x /build/headers.deb /build/sys
      # The tree name inside the deb is the UTS release (may differ from the
      # package suffix — profile packaging). Discover it by CONTENT.
      SYS="$(find /build/sys -maxdepth 3 -type d -path '*/usr/src/linux-headers-*' | head -1)"
      test -n "${SYS}" \
        || { echo "ERROR: no linux-headers tree in the deb" >&2; exit 1; }
      test -s "${SYS}/Makefile" \
        || { echo "ERROR: ${SYS} is not a module-ready headers tree" >&2; exit 1; }
      grep -qF "\"${KVER}\"" "${SYS}/include/generated/utsrelease.h" \
        || { echo "ERROR: headers tree UTS_RELEASE != ${KVER}" >&2; exit 1; }
      # The kbuild tree of a module pair needs the symbol table and the
      # resolved kernel config: the republished kernel deb carries both (at
      # /usr/lib/linux-kernel-build${SUFFIX}/) and the headers deb only
      # sometimes. Seed from the daemoncores-kernel-${KVER} deb of the SAME
      # index before any guard can fail (the debian module entries do the
      # same — SEED_DIR from COMMON_DEB).
      if ! test -s "${SYS}/Module.symvers" || ! test -s "${SYS}/.config"; then
        test -f /build/Packages || curl -fsSL "${BASE}/dists/trixie/main/binary-amd64/Packages" -o /build/Packages \
          || { echo "ERROR: cannot read the APT index ${BASE}/dists/trixie/main/binary-amd64/Packages" >&2; exit 1; }
        KPKG=$(awk '$1=="Package:" {p=$2} p ~ /^daemoncores-kernel-vm-.*-'"${FLAV}"'-xanmod1$/ {print p}' /build/Packages \
          | sort -rV | head -1)
        KPKG="${KPKG:-$(awk '$1=="Package:" {p=$2} p ~ /^daemoncores-kernel-.*-'"${FLAV}"'-xanmod1$/ {print p}' /build/Packages \
          | sort -rV | head -1)}"
        echo "zfs-module-pve: symvers/config seed from: ${KPKG:-<missing>}"
        test -n "${KPKG}" \
          || { echo "ERROR: no daemoncores-kernel-*-${FLAV}-xanmod1 deb in the APT index to seed the module tree from" >&2; exit 1; }
        rm -rf /build/kseed
        curl -fsSL "${BASE}/$(_filename_by_pkg "${KPKG}")" -o /build/kernel.deb \
          || { echo "ERROR: cannot download ${KPKG}" >&2; exit 1; }
        mkdir -p /build/kseed
        dpkg-deb -x /build/kernel.deb /build/kseed
        SEED="$(find /build/kseed -type d -path '*/usr/lib/linux-kernel-build*' -maxdepth 6 | head -1)"
        test -n "${SEED}" \
          || { echo "ERROR: ${KPKG} carries no /usr/lib/linux-kernel-build tree" >&2; exit 1; }
        test -s "${SEED}/Module.symvers" \
          || { echo "ERROR: ${SEED} carries no Module.symvers" >&2; exit 1; }
        cp "${SEED}/Module.symvers" "${SYS}/Module.symvers"
        KCFG="$(find "${SEED}" \( -name .config -o -name config \) -type f | head -1)"
        test -s "${KCFG}" && cp "${KCFG}" "${SYS}/.config"
      fi
      test -s "${SYS}/Module.symvers" && test -s "${SYS}/.config" \
        || { echo "ERROR: ${SYS} seeded incomplete (Module.symvers/.config missing)" >&2; exit 1; }
      # ABI guard (owner midi): the pair must NOT carry modversions CRCs —
      # the aligned tree was merged with CONFIG_MODVERSIONS=n (modules.cfg).
      grep -q '^CONFIG_MODVERSIONS=y' "${SYS}/.config" \
        && { echo "ERROR: ${KVER} tree carries MODVERSIONS — one-module ABI broken" >&2; exit 1; }

      # kbuild arch naming: the runner exports ARCH=amd64 job-wide but the
      # kernel build system only knows x86 — map BEFORE configure, whose
      # module-support probes are real kbuild test builds (an inherited
      # ARCH=amd64 fails every probe and reports CONFIG_MODULES undefined).
      export ARCH=x86
      ZFS_TAG="${ZFS_TAG:-zfs-2.4.4}"
      rm -rf /build/openzfs
      git clone --quiet --depth=1 --branch "${ZFS_TAG}" \
        https://github.com/openzfs/zfs.git /build/openzfs
      test -f /build/openzfs/zfs.release.in \
        || { echo "ERROR: openzfs clone ${ZFS_TAG} is not an OpenZFS tree" >&2; exit 1; }
      # The gitrev header is generated by make_gitrev.sh only via the in-tree
      # Makefile.am path, which the module-only build never runs — the kbuild
      # compile of the spl sources includes "zfs_gitrev.h" and dies without it
      # (proven run 42778822294). -I@abs_top_builddir@/include (module/Kbuild.in)
      # picks the tree copy up.
      ( cd /build/openzfs && ./scripts/make_gitrev.sh ) >/dev/null 2>&1 || :
      test -f /build/openzfs/include/zfs_gitrev.h \
        || { echo "ERROR: openzfs gitrev header not generated" >&2; exit 1; }
      ( cd /build/openzfs && ./autogen.sh ) >/dev/null 2>&1
      ( cd /build/openzfs && ./configure --with-config=kernel \
          --with-linux="$(readlink -e "${SYS}")" \
          --with-linux-obj="$(readlink -e "${SYS}")" ) \
        || { echo "ERROR: openzfs configure against ${SYS} failed" >&2; exit 1; }
      # the kbuild module build stays under the same mapping (kernel build
      # system naming; there is no wrapper that wants the Debian naming).
      export ARCH=x86
      # MODULE-ONLY target: the default `make` chains scripts/zfs-tests.sh -c
      # after the modules and fails off the module (proven make5). 2.x
      # merges the submodules: EXACTLY zfs.ko (zavl/znvpair/zunicode/
      # zcommon/zpios merged) + spl.ko; the build/ .ko are kbuild probes.
      # The composed kernel_build_module gate below runs the build and
      # assembles the deb (the ko presence it verifies itself).
      ZFS_VER="${ZFS_DEB_VER:-2.4.4-1}"
      DESC="PVE OpenZFS kernel modules (flavour ${FLAV})"
      DESC="${DESC}\n The OpenZFS ${ZFS_TAG} modules built against the published linux-headers deb"
      DESC="${DESC} of the ${KVER} tree (the ABI pair); one module ABI for both lanes"
      DESC="${DESC} of the release."
      # Depends on the ABI SLOT, never a profile package (owner order 14/11
      # after the apt-history proof: install zfs-module-pve-x64v3 pulls in the
      # VM kernel + removes the IA stack — the hardcoded
      # daemoncores-kernel-${HDR_PROFILE}-${KVER} Depends CHAINS the profile
      # and the two profile kernels are mutually Conflicting). Every kernel
      # build of the release PROVIDES the virtual linux-image-<KVER> (= the
      # built version; see the repack printf in the linux-image-profile class),
      # so the zfs module deb settles on WHICHEVER profile kernel is installed
      # and profiles no longer fight each other. IA and VM stay mutually
      # Conflicting BY DESIGN: they populate the SAME /lib/modules/${KVER}/
      # dir, so exactly one profile kernel may be installed at a time — the
      # Conflicts is the documented SHARED SLOT, not a packaging accident.
      ZDEP="linux-image-${KVER}"
      kernel_build_module "${SYS}" /build/openzfs/module \
        'make -C /build/openzfs/module -j"$(nproc)"' \
        "zfs-module-pve-${FLAV}" "${ZFS_VER}" "${KVER}" "zfs" \
        "${ZDEP}" \
        "${DESC}" \
        /build/openzfs/module/zfs.ko /build/openzfs/module/spl.ko
      rm -rf /build/sys /build/openzfs
    deb-glob: "zfs-module-pve-{variant}*"
    variants:
      x64v3:
        when:
          arch: amd64
      x64v1:
        when:
          arch: amd64
      x64v2:
        when:
          arch: amd64
      x64v4:
        when:
          arch: amd64
