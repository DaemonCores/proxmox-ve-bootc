# Package manifest for the bootc .deb builder.
# One entry per package CLASS (Gabriel spec 2026-10-30): the variants
# mechanism (same as the kernel entries) expands one build script across
# every package of the class — zero duplicated YAML. Downstream, the
# manifest-expand action resolves each variant into a plain package entry.
#
# Shared deb logic: DaemonCores-CI scripts/deb_helpers.sh, imported
# implicitly (strict mode enforced by build-deb.sh: -euo pipefail) by build-deb.sh (once, for every build) — no helper plumbing
# appears in the build blocks. The overlay model: package dirs mirror the deb tree
# (variant-source: "{variant}" hashes each mirror); modified upstream files
# are git .patch at the mirrored path; all-or-nothing dry-run first; .patch
# is never shipped. Drift = the deb build is skipped, the last-good deb is
# retained by build-deb.sh.
#
# HELPERS_VER is hashed per entry; bump it whenever the DaemonCores-CI deb
# helpers change (other repository, invisible to the content hash).
packages:
  - name: repacked
    variant-env: PKG
    variant-source: "{variant}"
    env:
      HELPERS_VER: 6
    build: |
      deb_repack "${PKG}" "${VER_SUFFIX}" "${PKG}"
    deb-glob: "{variant}_*"
    variants:
      libtemplate-perl:
        env:
          PKG: libtemplate-perl
          VER_SUFFIX: +bootc1
      libpve-storage-perl:
        env:
          PKG: libpve-storage-perl
          VER_SUFFIX: +bootc1
      pve-manager:
        env:
          PKG: pve-manager
          VER_SUFFIX: +bootc1
      qemu-server:
        env:
          PKG: qemu-server
          VER_SUFFIX: +bootc1
      proxmox-kernel-helper:
        env:
          PKG: proxmox-kernel-helper
          VER_SUFFIX: +bootc1
        upstream: proxmox-kernel-helper

  # class upstream-all: publishes the UNMODIFIED upstream deb of an
  # Architecture: all package, resolved dynamically from the amd64 PVE index
  # (no pinned version). The repacked class carries dependency floors cut
  # against that index (libpve-storage-perl depends on libpve-common-perl
  # (>= 9.2.3), pve-manager since 9.2.25 on libpve-cluster-api-perl
  # (>= 9.1.8), which itself exact-depends libpve-cluster-perl (= 9.1.8)),
  # while the Proxmox arm64 index lags the amd64 one for the
  # arch-independent packages both publish (measured 2026-11-02:
  # libpve-common-perl arm64 topped out at 9.2.2, amd64 at 9.2.5; measured
  # 2026-11-03: libpve-cluster-api-perl arm64 at 9.1.6, amd64 at 9.1.8 —
  # the arm64 image build then failed the floor, run 41614002966). The
  # package is Architecture: all, so the amd64-index deb is exactly what
  # the arm64 image needs; publishing it into the shared APT repo (whose
  # index mirrors arch-independent debs into every arch) satisfies the
  # floor for both image arches. On amd64 the registration below is a no-op
  # and the candidate is the native index's own copy — one build, both
  # arches. No repack: the deb keeps its upstream version string (no epoch,
  # no revision) so it cannot diverge from the upstream package it mirrors.
  - name: upstream-all
    variant-env: UPSTREAM_PKG
    variant-source: "{variant}"
    env:
      # Index arch to resolve across, registered as a dpkg foreign
      # architecture in the build (a no-op when it already is the native
      # one). The PVE apt source itself is the preinstalled
      # pve-no-subscription source — no URL belongs in this manifest.
      UPSTREAM_ARCH: amd64
    build: |
      # Registering the discovery arch puts that arch's index into the arch
      # list apt consults; plain-name resolution then picks the newest
      # candidate across all registered indexes.
      dpkg --add-architecture "${UPSTREAM_ARCH}"
      apt-get update

      # Plain name on purpose: a "${UPSTREAM_PKG}:${UPSTREAM_ARCH}" request
      # has no candidate for an Architecture: all entry — the all variant
      # only resolves across the arch list under the plain name (measured
      # 2026-11-02 on trixie).
      cd /tmp
      apt-get download "${UPSTREAM_PKG}"

      # The glob part must stay OUTSIDE the quotes: bash never expands a
      # glob inside "...", and dpkg-deb would receive the literal asterisk.
      set -- "/tmp/${UPSTREAM_PKG}"_*.deb
      [ -f "${1:-}" ] \
        || { echo "ERROR: no upstream .deb for ${UPSTREAM_PKG} left in /tmp after download" >&2; exit 1; }

      # Publish an arch-independent deb only: an arch-specific copy
      # resolved here would be unusable by the other arch's index.
      if [ "$(dpkg-deb -f "${1}" Architecture)" != "all" ]; then
        echo "ERROR: ${UPSTREAM_PKG} upstream deb is not Architecture: all; refusing to publish it" >&2
        exit 1
      fi

      # Verbatim bits, upstream filename and version: nothing to rebuild.
      cp -v "${1}" /debs/
      echo "published ${UPSTREAM_PKG} $(dpkg-deb -f "${1}" Version) from the ${UPSTREAM_ARCH} index"
    deb-glob: "{variant}_*"
    variants:
      libpve-common-perl:
        env:
          UPSTREAM_PKG: libpve-common-perl
        upstream: libpve-common-perl
      libpve-cluster-api-perl:
        env:
          UPSTREAM_PKG: libpve-cluster-api-perl
        upstream: libpve-cluster-api-perl
      libpve-cluster-perl:
        env:
          UPSTREAM_PKG: libpve-cluster-perl
        upstream: libpve-cluster-perl
      libpve-notify-perl:
        env:
          UPSTREAM_PKG: libpve-notify-perl
        upstream: libpve-notify-perl
      ifupdown2:
        env:
          UPSTREAM_PKG: ifupdown2
        upstream: ifupdown2

  # class overlay-tree: repack of an upstream package with a plain overlay
  # tree on top (fixes and drop-ins only — the DaemonCores-VE fork owns its
  # own overlay builds for the fork-only bits, e.g. the ifupdown2
  # autoconf/domain-set exec tools: the vanilla ifupdown2 is the UNMODIFIED
  # upstream deb, published by the upstream-all class above).
  - name: overlay-tree
    variant-env: PKG
    variant-source: "{variant}"
    env:
      HELPERS_VER: 7
    build: |
      deb_overlay_tree "${PKG}" "${VER_SUFFIX}" "${PKG}" ${EXTRA_EXEC:-}
    deb-glob: "{variant}_*"
    variants:
      chrony:
        env:
          PKG: chrony
          VER_SUFFIX: +bootc2
        upstream: chrony
      openipmi:
        env:
          PKG: openipmi
          VER_SUFFIX: +bootc1
        upstream: openipmi

  # ===========================================================================
  # kernel-pve: the PVE packaging + the SHARED XanMod patch set, the
  # transverse-variant strategy (Gabriel, 30/10). ONE class entry, one
  # variant per microarch level (KERNEL_ARCH_LEVEL: x64v1 / x64v2 / x64v3 /
  # x64v4, plus the arm64 flavours armv8.0 / armv8.2-lse / armv9-sve2);
  # the arm64 flavours build WITHOUT a gate (owner KERNEL FINAL v2,
  # 2026-11-03: the former coded-disabled KERNEL_ARM filter is retired —
  # seven flavours expand unconditionally; the arm64 flavours
  # cross-compile when the lane runs the arm64 arch). The build block
  # orchestrates the STANDARD kernel
  # helpers of DaemonCores-CI scripts/kernel_helpers.sh (kernel_pve_prepare,
  # kernel_apply_patches on the shared manifest, kernel_merge_config,
  # kernel_build_debs) — no logic is duplicated here.
  #
  # PRODUCTION lane (not artifact-only): the debs land in /debs and go
  # through the standard builder — content-hash cache, /debs/.meta, publish
  # to the DaemonCores APT repo like every other package. The flavour IS the
  # version suffix (CONFIG_LOCALVERSION="-x64v<n>-xanmod1", XanMod
  # convention): no +bootc1-style suffix on the kernel — the deb version is
  # the PVE packaging version + flavour, same as debian-bootc's linux-image
  # carries the kernel.org version. The bootc images take the deb from that
  # APT repo at image build (OCI image reference), the flavour being
  # selected per image; on the host the flavour is fixed at install and
  # never switched on a bootc system (immutability). Waves: no deps —
  # wave 0.
  #
  # Version resolution: KERNEL_VERSION is resolved from the Proxmox repo
  # itself (ROLLING anchor, owner arbitration 2026-11-03 12:55: newest
  # proxmox-kernel-<ver>-pve of the repo, NO pin); '7.0.14'-style numbers are
  # the PACKAGE versions. The patch series is resolved by the REAL kernel
  # version detected at build (the packaged tree's Makefile, echoed in the
  # build log) — the packaging number and the kernel series are two distinct
  # things. Guard: patches are the shared manifest (file mode) and are
  # DRY-RUN all-or-nothing before any touch of the tree (patch-guard
  # pattern); the lane-local kconfig sur-rides live in
  # kernel-pve/kconfig/ and the shared set + GPU fragments come from the
  # engine (CI_KERNEL_SHARED) — SINGLE kernel build per flavour, no vendor
  # matrix.
  - name: kernel-pve
    variant-env: KERNEL_ARCH_LEVEL
    # PATCH PARITY file mode (owner arbitration 2026-11-03 12:55): the patch
    # set is NOT defined here (no mirrors, no copies, no remote distfetch) —
    # the canonical patches-shared.yml lives in the build engine
    # (DaemonCores-CI build-deb/kernel-shared) and arrives in this very build
    # as CI_KERNEL_SHARED. One list, two consumers: the debian linux-image
    # build applies the same export; the series is resolved by the REAL
    # kernel version detected on the packaged tree. Never a copy in this
    # repo.
    env:
      HELPERS_VER: 7
      # Bump when the build contract changes in a way `sources:` alone
      # cannot express (e.g. the lib's behaviour for the same tree).
      # 7: the headers+symvers publish became the contract (see the env
      # comment block above; owner OOB scattering rule).
      # 5: THP arbitration revoked lane-side (owner 2026-11-03 13:05): the
      # shared fragment's ALWAYS pin now wins on this lane too (full-LXC
      # prime), the THP=never profile moves to the image-lane twins
      # (karg + tmpfiles, Containerfile.thpnever-*); x64v4 + the arm64
      # flavour variants are declared.
      # 6: loadable-module support is pinned in the lane kconfig — the
      # linux-headers deb of the flavour ships beside the image deb.
      # 7: the NVIDIA pairing build REVERTED to debian-bootc (owner 04/11
      # OOB, scattering rule: ONE module builder, ONE symvers producer):
      # this lane now only publishes the headers tree + full Module.symvers
      # the single builder compiles the pairs against.
      KERNEL_BUILD_VER: 7
      KERNEL_ARCH: x86_64
      KERNEL_OUT: /debs
    build: |
      # Shared data (owner arbitration 2026-11-03 12:55): the patch set AND
      # the kconfig fragments (incl. the GPU sets) come from the ENGINE
      # checkout — build-deb.sh exports build-deb/kernel-shared as
      # CI_KERNEL_SHARED next to CI_SCRIPTS. No raw.githubusercontent dist
      # fetch of a sibling production repo, no commit pin, no per-file sha
      # list: the export's content feeds the build content hash (the engine
      # hashes the shared directory), so a set change rebuilds this exact way.
      [[ -n "${CI_KERNEL_SHARED:-}" && -f "${CI_KERNEL_SHARED}/patches-shared.yml" ]] \
        || { echo "ERROR: CI_KERNEL_SHARED (engine kernel-shared export) missing" >&2; exit 1; }
      PATCHES_FILE="${CI_KERNEL_SHARED}/patches-shared.yml"
      KCFG_SHARED="${CI_KERNEL_SHARED}/kconfig-shared"

      # Version resolved from the Proxmox repo itself (ROLLING anchor, no
      # pin): the newest proxmox-kernel-<kernel>-pve package of the repo.
      # No package-name pin and no version pin here; the number of the PVE
      # packaging is NOT the kernel series — the series is re-detected on the
      # real tree below.
      echo "deb [arch=amd64] http://download.proxmox.com/debian/pve trixie pve-no-subscription" \
        > /etc/apt/sources.list.d/pve.list
      echo "deb-src [arch=amd64] http://download.proxmox.com/debian/pve trixie pve-no-subscription" \
        >> /etc/apt/sources.list.d/pve.list
      # Repo key (keyring fix, owner order 2026-11-03): the trixie archive
      # keyring baked into this repo's buildenv (sha-pinned in env.yml and
      # verified HERE at use time) — no CDN key fetch on the hot path.
      KRING_SHA=136673be77aba35dcce385b28737689ad64fd785a797e57897589aed08db6e45
      [[ -s /usr/share/keyrings/proxmox-archive-keyring.gpg ]] || \
        curl -fsSL https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg \
          -o /usr/share/keyrings/proxmox-archive-keyring.gpg \
        || { echo "ERROR: cannot obtain the proxmox archive keyring" >&2; exit 1; }
      [[ "$(sha256sum /usr/share/keyrings/proxmox-archive-keyring.gpg | cut -d" " -f1)" == "${KRING_SHA}" ]] \
        || { echo "ERROR: proxmox archive keyring sha256 mismatch (expected ${KRING_SHA})" >&2; exit 1; }
      cp /usr/share/keyrings/proxmox-archive-keyring.gpg \
        /etc/apt/trusted.gpg.d/proxmox-release-trixie.gpg
      apt-get update
      # APT-cache's regex anchoring is not reliable across the blob it
      # searches (observed: the -signed twin of the same version came back);
      # the authoritative selection RE-GREENS with ERE anchored on the exact
      # name, which excludes the -signed and -signed-template variants.
      KERNEL_VERSION=$(apt-cache search --names-only '^proxmox-kernel-[0-9]' \
        | awk '{print $1}' \
        | grep -E '^proxmox-kernel-[0-9][0-9.]*-[0-9]+-pve$' \
        | sed 's/^proxmox-kernel-//' | sort -V | tail -1)
      test -n "${KERNEL_VERSION}" \
        || { echo "ERROR: cannot resolve the PVE kernel version from the repo (rolling anchor)" >&2; exit 1; }
      echo "kernel-pve: rolling PVE kernel package version resolved from the repo: ${KERNEL_VERSION}"

      apt-get install -y --no-install-recommends \
        build-essential dpkg-dev devscripts curl git yq patch \
        bc bison flex libncurses-dev libssl-dev libelf-dev rsync kmod python3 \
        fakeroot ca-certificates \
        debhelper libdw-dev gawk zstd xz-utils lz4
      [[ "${KERNEL_ARCH}" = "arm64" ]] && \
        apt-get install -y --no-install-recommends \
          crossbuild-essential-arm64 gcc-aarch64-linux-gnu

      mkdir -p /build /debs

      # Standard kernel helpers (DaemonCores-CI scripts/kernel_helpers.sh,
      # sourced implicitly by deb_helpers.sh): packaging fetch, kconfig merge,
      # make deb-pkg.
      mkdir -p /build && kernel_pve_prepare /build

      # REAL kernel series detection (owner arbitration 2026-11-03 12:55):
      # the PVE packaging version resolved above is NOT the kernel series —
      # read the packaged tree's Makefile (that is what the XanMod/CachyOS
      # upstream series dirs serve) and resolve the patch series from it,
      # echoed in the build log.
      REAL_KVER=$(awk '/^VERSION *=/{v=$3} /^PATCHLEVEL *=/{p=$3} \
        /^SUBLEVEL *=/{s=$3} END{print v"."p"."s}' "${SRCDIR}/Makefile")
      [[ "${REAL_KVER}" == *.*.* ]] \
        || { echo "ERROR: cannot read the real kernel version from ${SRCDIR}/Makefile" >&2; exit 1; }
      echo "kernel-pve: REAL kernel series detected on the packaged tree: ${REAL_KVER}"

      # Patch mode: the SHARED manifest of the engine export (file mode of
      # the standard helper — this entry defines NO native patch data).
      # Debian arch of the patch stage, derived from the kernel arch dir.
      case "${KERNEL_ARCH}" in
        x86_64) DEB_ARCH=amd64 ;;
        *) DEB_ARCH="${KERNEL_ARCH}" ;;
      esac
      kernel_apply_patches "${PATCHES_FILE}" \
        "${DEB_ARCH}" "${REAL_KVER}" "${SRCDIR}"

      # Rolling seed (2026-11-04: the -28 PVE packaging ships NO base
      # .config -> fragments merged alone produced a THIN kernel — CONFIG_PCI
      # went unset, the NVIDIA pair refuses to compile on it). The seed = the
      # PVE repo's OWN signed kernel of the SAME resolved version (its
      # /boot config), downloaded at build: honest rolling, zero pin.
      if [[ ! -s "${SRCDIR}/.config" ]]; then
        SEED_PKG=$(apt-cache search --names-only '^proxmox-kernel-[0-9]' \
          | awk '{print $1}' | grep -- '-signed$' | sort -V | tail -1)
        test -n "${SEED_PKG}" \
          || { echo "ERROR: no signed PVE kernel package to seed the config from" >&2; exit 1; }
        apt-get download "${SEED_PKG}" >/dev/null \
          || { echo "ERROR: cannot download ${SEED_PKG}" >&2; exit 1; }
        SEED_DEB="${SEED_PKG}_"*.deb
        unset SEED_DEB  # glob below, not a var
        SEED_D=$(find . -maxdepth 1 -name "${SEED_PKG}_*.deb" | head -1)
        test -n "${SEED_D}" \
          || { echo "ERROR: downloaded signed kernel deb not found" >&2; exit 1; }
        rm -rf /tmp/seed && mkdir -p /tmp/seed
        dpkg-deb -x "${SEED_D}" /tmp/seed
        SEED_CFG=$(find /tmp/seed -path "*boot/config-*" | head -1)
        test -s "${SEED_CFG}" \
          || { echo "ERROR: the signed kernel deb carries no /boot config" >&2; exit 1; }
        cp "${SEED_CFG}" "${SRCDIR}/.config"
        echo "kernel-pve: seed config taken from ${SEED_D} (${SEED_CFG##*/}) "
      fi

      [[ -z "${PVE_SEED_CONFIG}" ]] || cp "${PVE_SEED_CONFIG}" "${SRCDIR}/.config"

      # Shared kconfig fragments + GPU sets (single source: the engine export,
      # same checkout that carries the patch manifest) and the lane-local
      # sur-rides of kernel-pve/kconfig/ (owner arbitration 2026-11-03
      # 12:55, THP lane-side pin REVOKED by the 13:05 arbitration: the
      # shared fragment's ALWAYS pin wins on this lane too — the full-LXC
      # AI profile is the default here; THP=never travels with the
      # image-lane twins, karg transparent_hugepage=never). An EMPTY lane
      # tree is legitimate: a glob with no match just adds nothing.
      LANE_KCFG="${GITHUB_WORKSPACE:-$(pwd)}/workflows/bootc-debs-builder/kernel-pve/kconfig"
      FRAGS=()
      shopt -s nullglob
      if [[ "${KERNEL_ARCH}" = "x86_64" ]]; then
        FRAGS+=("${KCFG_SHARED}/x86-common.cfg")
        [[ -s "${KCFG_SHARED}/${KERNEL_ARCH_LEVEL}.cfg" ]] && \
          FRAGS+=("${KCFG_SHARED}/${KERNEL_ARCH_LEVEL}.cfg")
        # GPU config sets (transverse: ONE optimised build, every vendor),
        # merged ahead of the flavour deltas and ahead of the lane sur-rides.
        for gs in ${KERNEL_GPU:-all}; do
          if [[ "${gs}" == "all" ]]; then gs_list="amd intel nvidia"; else gs_list="${gs}"; fi
          for f_name in ${gs_list}; do
            f_file="${KCFG_SHARED}/gpu/${f_name}.cfg"
            [[ -s "${f_file}" ]] \
              || { echo "ERROR: GPU kconfig fragment '${f_name}' missing from the engine export" >&2; exit 1; }
            FRAGS+=("${f_file}")
          done
        done
        # Lane-local sur-rides (optional; the THP=never pin MOVED to the
        # image twins per the 13:05 arbitration) — an empty tree adds nothing.
        for lane in "${LANE_KCFG}"/*.cfg; do
          FRAGS+=("${lane}")
        done
      else
        # arm64 lane: no x86 GPU sets; the arm64 flavour + common fragments
        # come from the same engine export as the x86 ones.
        [[ -s "${KCFG_SHARED}/${KERNEL_ARCH_LEVEL}.cfg" ]] && \
          FRAGS+=("${KCFG_SHARED}/${KERNEL_ARCH_LEVEL}.cfg")
        [[ -s "${LANE_KCFG}/arm64-common.cfg" ]] && FRAGS+=("${LANE_KCFG}/arm64-common.cfg")
        for lane in "${LANE_KCFG}"/*.cfg; do
          FRAGS+=("${lane}")
        done
      fi
      shopt -u nullglob

      if [[ "${KERNEL_ARCH}" = "x86_64" ]]; then
        # ONE flavour per variant (KERNEL_ARCH_LEVEL). KCFLAGS carries the
        # microarch (-march=x86-64-vN). The lane sur-rides are merged last so
        # NEVER always wins over the shared fragment's ALWAYS pin.
        kernel_merge_config "${SRCDIR}" "${FRAGS[@]}"
        # The pinned Ubuntu tree's objtool klp-checksum.c does not compile
        # (it calls static helpers of check.c) and objtool builds it whenever
        # libxxhash headers exist on the host. klp-build is only needed with
        # CONFIG_KLP_BUILD, so skip it unless the merged config enables it.
        grep -q '^CONFIG_KLP_BUILD=y' "${SRCDIR}/.config" \
          || export KERNEL_MAKE_ARGS="ARCH_HAS_KLP=n"
        # The 27/28 rolling mismatch: the cloned packaging rules are OLDER
        # than the kernel version resolved from the repo (master 7.0.14-27 vs
        # tree -28, the WARN at the prepare), so their ARCH_HAS_KLP=n hook
        # does not exist yet and objtool builds klp-checksum.o UNCONDITIONALLY
        # — which does not compile against the 28 tree. Remove the tool from
        # the tree outright (KLP stays off: nothing on a PVE LXC host
        # livepatches).
        for _ref in klp-checksum builtin-klp; do
          grep -rl "${_ref}" "${SRCDIR}/tools" 2>/dev/null | xargs -r \
            sed -i "/${_ref}/d" || true
          rm -f "${SRCDIR}/tools/objtool/${_ref}.c" 2>/dev/null || true
        done
        KCFLAGS=$(kernel_flavour_kcflags "${KERNEL_ARCH_LEVEL}")
        kernel_build_debs "${SRCDIR}" bindeb-pkg "${KCFLAGS}"
      else
        # arm64 flavours: ONE kernel per flavour, cross-compiled (no gate, KERNEL FINAL v2).
        [[ -z "${PVE_SEED_CONFIG}" ]] && make -C "${SRCDIR}" defconfig
        [[ -s "${LANE_KCFG}/arm64-common.cfg" ]] && \
          FRAGS+=("${LANE_KCFG}/arm64-common.cfg")
        kernel_merge_config "${SRCDIR}" "${FRAGS[@]}"
        KCFLAGS=$(kernel_flavour_kcflags "${KERNEL_ARCH_LEVEL}")
        kernel_build_debs "${SRCDIR}" bindeb-pkg "${KCFLAGS}"
      fi

      # make deb-pkg/bindeb-pkg writes the debs one directory above the tree.
      cp "$(dirname "${SRCDIR}")"/*.deb /debs/
      # PUBLISH the headers tree of the flavour for the module builders
      # (owner 2026-11-04 OOB: the vanilla lane builds NO NVIDIA modules —
      # it must ship the linux-headers deb of the kernel-pve plus the FULL
      # Module.symvers, the exact ABI contract the single module builder
      # (debian-bootc) compiles the pairs against, downloaded from the
      # published Pages artifact at ITS build). bindeb-pkg emits the
      # linux-headers deb whenever loadable-module support is in the merged
      # config; the symvers file is INJECTED into that deb under
      # /usr/lib/linux-kernel-build/ (the same layout the kernel deb carries
      # on the debian lane), so the builder fetches ONE artifact per tree.
      HDR_DEB=$(find "$(dirname "${SRCDIR}")" -maxdepth 1 \
        -name "linux-headers-*${KERNEL_ARCH_LEVEL}*.deb" ! -name '*-all*' | head -1)
      test -n "${HDR_DEB}" \
        || { echo "ERROR: no linux-headers deb of ${KERNEL_ARCH_LEVEL} published" >&2; exit 1; }
      SYMVERS="${SRCDIR}/Module.symvers"
      test -s "${SYMVERS}" \
        || { echo "ERROR: the tree carries no Module.symvers for the headers deb" >&2; exit 1; }
      HDR_STAGE=$(mktemp -d /tmp/hdr-inject.XXXXXX)
      dpkg-deb -R "${HDR_DEB}" "${HDR_STAGE}/pkg"
      mkdir -p "${HDR_STAGE}/pkg/usr/lib/linux-kernel-build"
      cp "${SYMVERS}" "${HDR_STAGE}/pkg/usr/lib/linux-kernel-build/Module.symvers"
      ( cd "${HDR_STAGE}/pkg" && \
        find usr/lib/linux-kernel-build -type f | xargs md5sum | sed 's|usr/|/usr/|' \
        >> DEBIAN/md5sums )
      dpkg-deb --build "${HDR_STAGE}/pkg" "${HDR_DEB}"
      rm -rf "${HDR_STAGE}"

      # THE NVIDIA PAIR (owner 04/11 OOB: ONE kernel-modules build per repo
      # that ships a kernel — the LOGIC stays the engine's shared helpers).
      # The vanilla lane compiles the NVIDIA open modules against ITS OWN
      # prepared tree (SYSSRC = the live SRCDIR: kbuild, .config and
      # Module.symvers are all local — no headers-deb download), and
      # publishes the pair beside the kernel it is bound to. amd64 only.
      if [ "$(dpkg --print-architecture)" = "amd64" ]; then
        NVIDIA_OPEN_TAG="595.104.02"
        rm -rf /build/nvidia-open
        git clone --quiet --depth=1 --branch "${NVIDIA_OPEN_TAG}" \
          https://github.com/NVIDIA/open-gpu-kernel-modules.git /build/nvidia-open
        test -d /build/nvidia-open/kernel-open \
          || { echo "ERROR: nvidia-open has no kernel-open tree" >&2; exit 1; }

        GPU_NVIDIA_YML="${CI_KERNEL_SHARED}/patches-gpu/nvidia.yml"
        [[ -f "${GPU_NVIDIA_YML}" ]] \
          || { echo "ERROR: engine patches-gpu/nvidia.yml missing" >&2; exit 1; }
        [[ -n "${KERNEL_ARCH_LEVEL:-}" ]] \
          || { echo "ERROR: KERNEL_ARCH_LEVEL missing (flavour = the pair suffix)" >&2; exit 1; }
        # The kernel release string as packaged: real version + LOCALVERSION
        # (the flavour suffix the image deb name and /lib/modules use).
        IMG_DEB=$(find /debs -maxdepth 1 -name "linux-image-*${KERNEL_ARCH_LEVEL}*.deb" ! -name "*dbg*" | head -1)
        test -n "${IMG_DEB}" \
          || { echo "ERROR: no linux-image deb of ${KERNEL_ARCH_LEVEL} built" >&2; exit 1; }
        KVER=$(dpkg-deb -f "${IMG_DEB}" Package | sed 's/^linux-image-//')
        PATCHES_SERIES="${KVER%%-*}"
        export PATCHES_SERIES
        kernel_apply_patches "${GPU_NVIDIA_YML}" "amd64" "${NVIDIA_OPEN_TAG}" "/build/nvidia-open"
        unset PATCHES_SERIES

        # The NVIDIA wrapper Makefile expects its OWN arch scheme (x86_64).
        make ARCH="x86_64" -C /build/nvidia-open \
          SYSSRC="${SRCDIR}" SYSOUT="${SRCDIR}" -j"$(nproc)" modules

        NV_PKG="linux-modules-nvidia-pve-${KERNEL_ARCH_LEVEL}"
        DESTDIR="/output/${NV_PKG}"
        rm -rf "${DESTDIR}"
        mkdir -p "${DESTDIR}/DEBIAN" "${DESTDIR}/lib/modules/${KVER}"
        make -C /build/nvidia-open \
          SYSSRC="${SRCDIR}" SYSOUT="${SRCDIR}" \
          INSTALL_MOD_PATH="${DESTDIR}" INSTALL_MOD_STRIP=1 modules_install
        rm -f "${DESTDIR}/lib/modules/${KVER}/build" \
          "${DESTDIR}/lib/modules/${KVER}/source"
        test -n "$(find "${DESTDIR}/lib/modules/${KVER}" -name "nvidia*.ko" | head -1)" \
          || { echo "ERROR: modules_install produced no nvidia*.ko" >&2; exit 1; }

        # Drop the module metadata the kernel deb already owns (collision).
        find "${DESTDIR}/lib/modules/${KVER}" -maxdepth 1 \
          -name "modules.*" -delete

        VERSION="595.104.02-1"
        printf 'Package: %s\nVersion: %s\nArchitecture: %s\nMaintainer: DaemonCores <packaging@daemoncores.org>\nDepends: linux-image-%s\nDescription: PVE NVIDIA open kernel modules pair (flavour %s)\n The NVIDIA open-gpu-kernel-modules 595.104.02 compiled against the kernel-pve %s tree of this repo (the ABI pair); loader policy and GSP knobs live in the gpu-set debs.\n' \
          "${NV_PKG}" "${VERSION}" "$(dpkg --print-architecture)" "${KVER}" "${KERNEL_ARCH_LEVEL}" "${KVER}" \
          > "${DESTDIR}/DEBIAN/control"
        ( cd "${DESTDIR}" && find . -type f | sed 's|^\./||' >> DEBIAN/md5sums )
        dpkg-deb --build "${DESTDIR}" "/debs/${NV_PKG}_${VERSION}_amd64.deb"
        ls -la "/debs/${NV_PKG}_${VERSION}_amd64.deb"
      fi

      # Free the ~10 GB source tree now that the debs are in /debs.
      rm -rf "${SRCDIR}" /build
      ls -la /debs
    # deb-glob is NOT {variant}-substituted by expand.jq (only variant-source
    # and variant-deps are): every variant carries its own literal glob.
    deb-glob: "linux-*x64v1*"
    variants:
      x64v1:
        when:
          arch: amd64
      x64v2:
        when:
          arch: amd64
        deb-glob: "linux-*x64v2*"
      x64v3:
        when:
          arch: amd64
        deb-glob: "linux-*x64v3*"
      x64v4:
        when:
          arch: amd64
        deb-glob: "linux-*x64v4*"
      armv8.0:
        when:
          arch: arm64
        env:
          KERNEL_ARCH: arm64
        deb-glob: "linux-*armv8.0*"
      armv8.2-lse:
        when:
          arch: arm64
        env:
          KERNEL_ARCH: arm64
        deb-glob: "linux-*armv8.2-lse*"
      armv9-sve2:
        when:
          arch: arm64
        env:
          KERNEL_ARCH: arm64
        deb-glob: "linux-*armv9-sve2*"
  - name: source-build
    variant-env: PKG
    variant-source: "{variant}-src"
    env:
      HELPERS_VER: 6
    build: |
      deb_source_build "${PKG}" "${UP_COMMIT}" "${SRC_VER}" "${PKG}-src" pve-cluster libpve-cluster-api-perl
    deb-glob: "{variant}_*"
    variants:
      pve-cluster:
        env:
          PKG: pve-cluster
          UP_COMMIT: 66c87e0e7587a247f879f6f59e3bb5f3dd008e1f
          SRC_VER: 9.1.7.1+bootc1
