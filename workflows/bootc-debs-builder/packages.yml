# Package manifest for the bootc .deb builder.
# One entry per package CLASS (Gabriel spec 2026-10-30): the variants
# mechanism (same as the kernel entries) expands one build script across
# every package of the class — zero duplicated YAML. Downstream, the
# manifest-expand action resolves each variant into a plain package entry.
#
# Shared deb logic: DaemonCores-CI scripts/deb_helpers.sh, imported
# implicitly (strict mode enforced by build-deb.sh: -euo pipefail) by build-deb.sh (once, for every build) — no helper plumbing
# appears in the build blocks. The overlay model: package dirs mirror the deb tree
# (variant-source: "{variant}" hashes each mirror); modified upstream files
# are git .patch at the mirrored path; all-or-nothing dry-run first; .patch
# is never shipped. Drift = the deb build is skipped, the last-good deb is
# retained by build-deb.sh.
#
# HELPERS_VER is hashed per entry; bump it whenever the DaemonCores-CI deb
# helpers change (other repository, invisible to the content hash).
packages:
  - name: repacked
    variant-env: PKG
    variant-source: "{variant}"
    env:
      HELPERS_VER: 6
    build: |
      deb_repack "${PKG}" "${VER_SUFFIX}" "${PKG}"
    deb-glob: "{variant}_*"
    variants:
      libtemplate-perl:
        env:
          PKG: libtemplate-perl
          VER_SUFFIX: +bootc1
      libpve-storage-perl:
        env:
          PKG: libpve-storage-perl
          VER_SUFFIX: +bootc1
      pve-manager:
        env:
          PKG: pve-manager
          VER_SUFFIX: +bootc1
      qemu-server:
        env:
          PKG: qemu-server
          VER_SUFFIX: +bootc1
      proxmox-kernel-helper:
        env:
          PKG: proxmox-kernel-helper
          VER_SUFFIX: +bootc1
        upstream: proxmox-kernel-helper

  # class upstream-all: publishes the UNMODIFIED upstream deb of an
  # Architecture: all package, resolved dynamically from the amd64 PVE index
  # (no pinned version). The repacked class carries dependency floors cut
  # against that index (libpve-storage-perl depends on libpve-common-perl
  # (>= 9.2.3), pve-manager since 9.2.25 on libpve-cluster-api-perl
  # (>= 9.1.8), which itself exact-depends libpve-cluster-perl (= 9.1.8)),
  # while the Proxmox arm64 index lags the amd64 one for the
  # arch-independent packages both publish (measured 2026-11-02:
  # libpve-common-perl arm64 topped out at 9.2.2, amd64 at 9.2.5; measured
  # 2026-11-03: libpve-cluster-api-perl arm64 at 9.1.6, amd64 at 9.1.8 —
  # the arm64 image build then failed the floor, run 41614002966). The
  # package is Architecture: all, so the amd64-index deb is exactly what
  # the arm64 image needs; publishing it into the shared APT repo (whose
  # index mirrors arch-independent debs into every arch) satisfies the
  # floor for both image arches. On amd64 the registration below is a no-op
  # and the candidate is the native index's own copy — one build, both
  # arches. No repack: the deb keeps its upstream version string (no epoch,
  # no revision) so it cannot diverge from the upstream package it mirrors.
  - name: upstream-all
    variant-env: UPSTREAM_PKG
    variant-source: "{variant}"
    env:
      # Index arch to resolve across, registered as a dpkg foreign
      # architecture in the build (a no-op when it already is the native
      # one). The PVE apt source itself is the preinstalled
      # pve-no-subscription source — no URL belongs in this manifest.
      UPSTREAM_ARCH: amd64
    build: |
      # Registering the discovery arch puts that arch's index into the arch
      # list apt consults; plain-name resolution then picks the newest
      # candidate across all registered indexes.
      dpkg --add-architecture "${UPSTREAM_ARCH}"
      apt-get update

      # Plain name on purpose: a "${UPSTREAM_PKG}:${UPSTREAM_ARCH}" request
      # has no candidate for an Architecture: all entry — the all variant
      # only resolves across the arch list under the plain name (measured
      # 2026-11-02 on trixie).
      cd /tmp
      apt-get download "${UPSTREAM_PKG}"

      # The glob part must stay OUTSIDE the quotes: bash never expands a
      # glob inside "...", and dpkg-deb would receive the literal asterisk.
      set -- "/tmp/${UPSTREAM_PKG}"_*.deb
      [ -f "${1:-}" ] \
        || { echo "ERROR: no upstream .deb for ${UPSTREAM_PKG} left in /tmp after download" >&2; exit 1; }

      # Publish an arch-independent deb only: an arch-specific copy
      # resolved here would be unusable by the other arch's index.
      if [ "$(dpkg-deb -f "${1}" Architecture)" != "all" ]; then
        echo "ERROR: ${UPSTREAM_PKG} upstream deb is not Architecture: all; refusing to publish it" >&2
        exit 1
      fi

      # Verbatim bits, upstream filename and version: nothing to rebuild.
      cp -v "${1}" /debs/
      echo "published ${UPSTREAM_PKG} $(dpkg-deb -f "${1}" Version) from the ${UPSTREAM_ARCH} index"
    deb-glob: "{variant}_*"
    variants:
      libpve-common-perl:
        env:
          UPSTREAM_PKG: libpve-common-perl
        upstream: libpve-common-perl
      libpve-cluster-api-perl:
        env:
          UPSTREAM_PKG: libpve-cluster-api-perl
        upstream: libpve-cluster-api-perl
      libpve-cluster-perl:
        env:
          UPSTREAM_PKG: libpve-cluster-perl
        upstream: libpve-cluster-perl
      libpve-notify-perl:
        env:
          UPSTREAM_PKG: libpve-notify-perl
        upstream: libpve-notify-perl
      ifupdown2:
        env:
          UPSTREAM_PKG: ifupdown2
        upstream: ifupdown2

  # class overlay-tree: repack of an upstream package with a plain overlay
  # tree on top (fixes and drop-ins only — the DaemonCores-VE fork owns its
  # own overlay builds for the fork-only bits, e.g. the ifupdown2
  # autoconf/domain-set exec tools: the vanilla ifupdown2 is the UNMODIFIED
  # upstream deb, published by the upstream-all class above).
  - name: overlay-tree
    variant-env: PKG
    variant-source: "{variant}"
    env:
      HELPERS_VER: 7
    build: |
      deb_overlay_tree "${PKG}" "${VER_SUFFIX}" "${PKG}" ${EXTRA_EXEC:-}
    deb-glob: "{variant}_*"
    variants:
      chrony:
        env:
          PKG: chrony
          VER_SUFFIX: +bootc2
        upstream: chrony
      openipmi:
        env:
          PKG: openipmi
          VER_SUFFIX: +bootc1
        upstream: openipmi

  # ===========================================================================
  # kernel-pve: PIVOT 7.2 UNIFIÉ (owner 2026-11-05) — the source tree is the
  # upstream MAINLINE kernel.org release (pinned KERNEL_VER below, the SAME
  # source and mechanics as the debian lane linux-image entry:
  # kernel_fetch_source, sha256-verified); the Proxmox packaging submodule
  # (mirror_ubuntu-kernels) and its clone walk-back are OUT of the build path.
  # The Proxmox identity re-enters as ADDITIVES only (owner pivot points b/c):
  #   - patches: patches-pve.yml of the SHARED engine export, applied AFTER
  #     the patches-shared set, dry-run ALL fuzz 0 all-or-nothing;
  #   - release string: the lane appends "-pve" over the flavour
  #     (LOCALVERSION=-pve at build: 7.2.15-<x64vN/arm*-flavour>-xanmod1-pve,
  #     distinct from the debian lane release 7.2.15-...-xanmod1);
  #   - config seed: the /boot config of the PVE repo's OWN signed kernel of
  #     the resolved rolling version (in place since 2026-11-04); the PVE
  #     packaging CONFIG deltas are baked into a running PVE kernel, so the
  #     signed /boot config IS the delta carrier.
  # ONE class entry, one variant per microarch level (KERNEL_ARCH_LEVEL:
  # x64v1 / x64v2 / x64v3 / x64v4, plus the arm64 flavours armv8.0 /
  # armv8.2-lse / armv9-sve2); the arm64 flavours build WITHOUT a gate (owner KERNEL FINAL v2,
  # 2026-11-03: the former coded-disabled KERNEL_ARM filter is retired —
  # seven flavours expand unconditionally; the arm64 flavours
  # cross-compile when the lane runs the arm64 arch). The build block
  # orchestrates the STANDARD kernel
  # helpers of DaemonCores-CI scripts/kernel_helpers.sh (kernel_fetch_source,
  # kernel_apply_patches on the shared manifest THEN the patches-pve
  # additive set, kernel_merge_config, kernel_build_debs) — no logic is
  # duplicated here.
  #
  # PRODUCTION lane (not artifact-only): the debs land in /debs and go
  # through the standard builder — content-hash cache, /debs/.meta, publish
  # to the DaemonCores APT repo like every other package. The flavour IS the
  # release suffix (CONFIG_LOCALVERSION="-x64v<n>-xanmod1" + the lane env
  # LOCALVERSION=-pve, XanMod/PVE convention): no +bootc1-style suffix on
  # the kernel — the deb version is the kernel.org release + flavour + pve,
  # same shape as debian-bootc's linux-image (carries the kernel.org
  # version). The bootc images take the deb from that
  # APT repo at image build (OCI image reference), the flavour being
  # selected per image; on the host the flavour is fixed at install and
  # never switched on a bootc system (immutability). Waves: no deps —
  # wave 0.
  #
  # Version resolution: the KERNEL RELEASE is RESOLVED AT BUILD (see the
  # track block below — the standard mechanism, no fixed version env,
  # owner order 2026-11-05 01:5x); KERNEL_VERSION resolved from the Proxmox repo
  # (ROLLING anchor, owner arbitration 2026-11-03 12:55, newest
  # proxmox-kernel-<ver>-pve of the repo, NO pin) now only names the
  # packaging identity for the CONFIG SEED selection and the log — the
  # packaging number and the kernel series are two distinct things (pivot
  # 7.2: the series is the pinned mainline, verified against the tree's
  # Makefile). Guard: patches are the shared manifest + the patches-pve
  # additives (file mode) and are
  # DRY-RUN all-or-nothing before any touch of the tree (patch-guard
  # pattern); the lane-local kconfig sur-rides live in
  # kernel-pve/kconfig/ and the shared set + GPU fragments come from the
  # engine (CI_KERNEL_SHARED) — SINGLE kernel build per flavour, no vendor
  # matrix.
  - name: kernel-pve
    variant-env: KERNEL_ARCH_LEVEL
    # PATCH PARITY file mode (owner arbitration 2026-11-03 12:55): the patch
    # set is NOT defined here (no mirrors, no copies, no remote distfetch) —
    # the canonical patches-shared.yml lives in the build engine
    # (DaemonCores-CI build-deb/kernel-shared) and arrives in this very build
    # as CI_KERNEL_SHARED. One list, two consumers: the debian linux-image
    # build applies the same export; the series is resolved by the REAL
    # kernel version detected on the packaged tree. Never a copy in this
    # repo.
    env:
      HELPERS_VER: 8
      # Bump when the build contract changes in a way `sources:` alone
      # cannot express (e.g. the lib's behaviour for the same tree).
      # 8: PIVOT 7.2 unifié (owner 2026-11-05): the source tree is the pinned
      # upstream MAINLINE tarball (kernel_fetch_source), NOT the PVE
      # packaging; patches = shared set + patches-pve.yml additive set; the
      # release carries the -pve LOCALVERSION suffix.
      # 7: the headers+symvers publish became the contract (see the env
      # comment block above; owner OOB scattering rule).
      # 5: THP arbitration revoked lane-side (owner 2026-11-03 13:05): the
      # shared fragment's ALWAYS pin now wins on this lane too (full-LXC
      # prime), the THP=never profile moves to the image-lane twins
      # (karg + tmpfiles, Containerfile.thpnever-*); x64v4 + the arm64
      # flavour variants are declared.
      # 6: loadable-module support is pinned in the lane kconfig — the
      # linux-headers deb of the flavour ships beside the image deb.
      # 7: NVIDIA pairing build REVERTED to debian-bootc (owner 04/11, ONE
      # module builder, ONE symvers producer); 8: PIVOT 7.2 unifié
      # (owner 2026-11-05): the tree is the pinned mainline release, the
      # -pve suffix lands on the release, and the pairs rebuild against the
      # fresh tree (SRCDIR local, unchanged).
      KERNEL_BUILD_VER: 8
      KERNEL_ARCH: x86_64
      KERNEL_OUT: /debs
    # DYNAMIC UPSTREAM RESOLUTION (owner order 2026-11-05 01:5x: NO fixed
    # kernel version anywhere): the SAME mechanism as the debian lane — the
    # standard track resolution (upstream-track/track.sh): the newest
    # stable kernel.org release of the CURRENT patch-proven stream, the
    # tarball sha256 read from sha256sums.asc at build time (no literal
    # version, no frozen digest in this manifest). The `series:` value is a
    # STREAM anchor, not a version: the newest 7.2.x is built while it
    # streams, and resolution auto-advances when the series moves. The PVE
    # additive dry-run re-validates the RESOLVED tree at build (fuzz 0,
    # all-or-nothing) — a series the patch data does not cover fails the
    # build and keeps the last-good deb (proven live: the set's first
    # conflict on the newer stream, 0055-KVM... on 7.3.1).
    track:
      KERNEL_VER:
        kernel-org: stable
        series: "7.2"
        digests:
          KERNEL_SHA256: "linux-{version}.tar.xz"
    build: |
      # Shared data (owner arbitration 2026-11-03 12:55): the patch set AND
      # the kconfig fragments (incl. the GPU sets) come from the ENGINE
      # checkout — build-deb.sh exports build-deb/kernel-shared as
      # CI_KERNEL_SHARED next to CI_SCRIPTS. No raw.githubusercontent dist
      # fetch of a sibling production repo, no commit pin, no per-file sha
      # list: the export's content feeds the build content hash (the engine
      # hashes the shared directory), so a set change rebuilds this exact way.
      [[ -n "${CI_KERNEL_SHARED:-}" && -f "${CI_KERNEL_SHARED}/patches-shared.yml" ]] \
        || { echo "ERROR: CI_KERNEL_SHARED (engine kernel-shared export) missing" >&2; exit 1; }
      PATCHES_FILE="${CI_KERNEL_SHARED}/patches-shared.yml"
      KCFG_SHARED="${CI_KERNEL_SHARED}/kconfig-shared"

      # Version resolved from the Proxmox repo itself (ROLLING anchor, no
      # pin): the newest proxmox-kernel-<kernel>-pve package of the repo.
      # No package-name pin and no version pin here; the number of the PVE
      # packaging is NOT the kernel series — the series is re-detected on the
      # real tree below.
      echo "deb [arch=amd64] http://download.proxmox.com/debian/pve trixie pve-no-subscription" \
        > /etc/apt/sources.list.d/pve.list
      echo "deb-src [arch=amd64] http://download.proxmox.com/debian/pve trixie pve-no-subscription" \
        >> /etc/apt/sources.list.d/pve.list
      # Repo key (keyring fix, owner order 2026-11-03): the trixie archive
      # keyring baked into this repo's buildenv (sha-pinned in env.yml and
      # verified HERE at use time) — no CDN key fetch on the hot path.
      KRING_SHA=136673be77aba35dcce385b28737689ad64fd785a797e57897589aed08db6e45
      [[ -s /usr/share/keyrings/proxmox-archive-keyring.gpg ]] || \
        curl -fsSL https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg \
          -o /usr/share/keyrings/proxmox-archive-keyring.gpg \
        || { echo "ERROR: cannot obtain the proxmox archive keyring" >&2; exit 1; }
      [[ "$(sha256sum /usr/share/keyrings/proxmox-archive-keyring.gpg | cut -d" " -f1)" == "${KRING_SHA}" ]] \
        || { echo "ERROR: proxmox archive keyring sha256 mismatch (expected ${KRING_SHA})" >&2; exit 1; }
      cp /usr/share/keyrings/proxmox-archive-keyring.gpg \
        /etc/apt/trusted.gpg.d/proxmox-release-trixie.gpg
      apt-get update
      # APT-cache's regex anchoring is not reliable across the blob it
      # searches (observed: the -signed twin of the same version came back);
      # the authoritative selection RE-GREENS with ERE anchored on the exact
      # name, which excludes the -signed and -signed-template variants.
      KERNEL_VERSION="${KERNEL_VERSION:-$(apt-cache search --names-only '^proxmox-kernel-[0-9]' \
        | awk '{print $1}' \
        | grep -E '^proxmox-kernel-[0-9][0-9.]*-[0-9]+-pve$' \
        | sed 's/^proxmox-kernel-//' | sort -V | tail -1)}"
      test -n "${KERNEL_VERSION}" \
        || { echo "ERROR: cannot resolve the PVE kernel version from the repo (rolling anchor)" >&2; exit 1; }
      echo "kernel-pve: PVE kernel package version in build: ${KERNEL_VERSION}"

      apt-get install -y --no-install-recommends \
        build-essential dpkg-dev devscripts curl git yq patch \
        bc bison flex libncurses-dev libssl-dev libelf-dev rsync kmod python3 \
        fakeroot ca-certificates \
        debhelper libdw-dev gawk zstd xz-utils lz4 \
        autoconf automake libtool
      [[ "${KERNEL_ARCH}" = "arm64" ]] && \
        apt-get install -y --no-install-recommends \
          crossbuild-essential-arm64 gcc-aarch64-linux-gnu

      mkdir -p /build /debs

      # SOURCE (pivot 7.2 unifié, owner 2026-11-05): the upstream MAINLINE
      # kernel.org tarball, downloaded and sha256-verified by the STANDARD
      # helper (the debian lane's mechanism — same source, same helper); the
      # PVE packaging clone (kernel_pve_prepare/kernel_pve_clone_packaging)
      # and its mirror_ubuntu-kernels submodule are OUT of the build path.
      # kernel_fetch_source sets SRCDIR. bindeb-pkg does not require git
      # linkage (the debian lane builds it from the same kind of tree).
      kernel_fetch_source "${KERNEL_VER}" "${KERNEL_SHA256}"

      # The runner inherits ARCH=amd64; the kernel arch dir is x86_64 —
      # export BEFORE any make (olddefconfig, bindeb-pkg): make would look
      # for arch/amd64/Makefile otherwise (first pivot run, live).
      export ARCH="${KERNEL_ARCH}"

      # Identity guard (the RESOLVED upstream and the ACTUAL tree must
      # agree — the night cost of a wrong-path resolution made this a hard
      # check): the tree Makefile is the truth the patch manifests resolve
      # against.
      TREE_KVER=$(awk '/^VERSION *=/{v=$3} /^PATCHLEVEL *=/{p=$3} \
        /^SUBLEVEL *=/{s=$3} END{print v"."p"."s}' "${SRCDIR}/Makefile")
      [[ "${TREE_KVER}" == "${KERNEL_VER}" ]] \
        || { echo "ERROR: tree ${TREE_KVER} != pinned KERNEL_VER ${KERNEL_VER}" >&2; exit 1; }
      echo "kernel-pve: mainline tree ${TREE_KVER} (PVE packaging identity resolved above)"

      # Patch mode: the SHARED manifest FIRST, then the PVE ADDITIVE set of
      # the same engine export (pivot 7.2, owner points a/b/c — this entry
      # defines NO native patch data). Debian arch of the patch stage,
      # derived from the kernel arch dir. Both manifests dry-run ALL fuzz 0
      # all-or-nothing inside the helper; patches-pve.yml entries carry
      # sha256 pins (mirror .patch bytes are immutable).
      case "${KERNEL_ARCH}" in
        x86_64) DEB_ARCH=amd64 ;;
        *) DEB_ARCH="${KERNEL_ARCH}" ;;
      esac
      kernel_apply_patches "${PATCHES_FILE}" \
        "${DEB_ARCH}" "${KERNEL_VER}" "${SRCDIR}"
      PVE_PATCHES_FILE="${CI_KERNEL_SHARED}/patches-pve.yml"
      [[ -f "${PVE_PATCHES_FILE}" ]] \
        || { echo "ERROR: CI_KERNEL_SHARED patches-pve.yml missing (guards an older engine checkout from silently skipping the PVE set)" >&2; exit 1; }
      kernel_apply_patches "${PVE_PATCHES_FILE}" \
        "${DEB_ARCH}" "${KERNEL_VER}" "${SRCDIR}"

      # CONFIG SEED (pivot 7.2, owner point d — in place, unchanged): a
      # mainline tarball carries no .config, so the seed is ALWAYS taken:
      # the /boot config of the PVE repo's OWN signed kernel (its rolling
      # reference, honest — zero pin). The PVE packaging CONFIG deltas
      # (PVE_CONFIG_OPTS) are baked into a running PVE kernel by the same
      # scripts/config pass its rules run, so the signed /boot config IS
      # the delta carrier; lane-local deviations stay in kernel-pve/kconfig.
      if [[ ! -s "${SRCDIR}/.config" ]]; then
        SEED_PKG=$(apt-cache search --names-only '^proxmox-kernel-[0-9]' \
          | awk '{print $1}' | grep -- '-signed$' | sort -V | tail -1)
        test -n "${SEED_PKG}" \
          || { echo "ERROR: no signed PVE kernel package to seed the config from" >&2; exit 1; }
        apt-get download "${SEED_PKG}" >/dev/null \
          || { echo "ERROR: cannot download ${SEED_PKG}" >&2; exit 1; }
        SEED_DEB="${SEED_PKG}_"*.deb
        unset SEED_DEB  # glob below, not a var
        SEED_D=$(find . -maxdepth 1 -name "${SEED_PKG}_*.deb" | head -1)
        test -n "${SEED_D}" \
          || { echo "ERROR: downloaded signed kernel deb not found" >&2; exit 1; }
        rm -rf /tmp/seed && mkdir -p /tmp/seed
        dpkg-deb -x "${SEED_D}" /tmp/seed
        SEED_CFG=$(find /tmp/seed -path "*boot/config-*" | head -1)
        test -s "${SEED_CFG}" \
          || { echo "ERROR: the signed kernel deb carries no /boot config" >&2; exit 1; }
        cp "${SEED_CFG}" "${SRCDIR}/.config"
        echo "kernel-pve: seed config taken from ${SEED_D} (${SEED_CFG##*/}) "
      fi

      # Shared kconfig fragments + GPU sets (single source: the engine export,
      # same checkout that carries the patch manifest) and the lane-local
      # sur-rides of kernel-pve/kconfig/ (owner arbitration 2026-11-03
      # 12:55, THP lane-side pin REVOKED by the 13:05 arbitration: the
      # shared fragment's ALWAYS pin wins on this lane too — the full-LXC
      # AI profile is the default here; THP=never travels with the
      # image-lane twins, karg transparent_hugepage=never). An EMPTY lane
      # tree is legitimate: a glob with no match just adds nothing.
      LANE_KCFG="${GITHUB_WORKSPACE:-$(pwd)}/workflows/bootc-debs-builder/kernel-pve/kconfig"
      FRAGS=()
      shopt -s nullglob
      if [[ "${KERNEL_ARCH}" = "x86_64" ]]; then
        FRAGS+=("${KCFG_SHARED}/x86-common.cfg")
        [[ -s "${KCFG_SHARED}/${KERNEL_ARCH_LEVEL}.cfg" ]] && \
          FRAGS+=("${KCFG_SHARED}/${KERNEL_ARCH_LEVEL}.cfg")
        # GPU config sets (transverse: ONE optimised build, every vendor),
        # merged ahead of the flavour deltas and ahead of the lane sur-rides.
        for gs in ${KERNEL_GPU:-all}; do
          if [[ "${gs}" == "all" ]]; then gs_list="amd intel nvidia"; else gs_list="${gs}"; fi
          for f_name in ${gs_list}; do
            f_file="${KCFG_SHARED}/gpu/${f_name}.cfg"
            [[ -s "${f_file}" ]] \
              || { echo "ERROR: GPU kconfig fragment '${f_name}' missing from the engine export" >&2; exit 1; }
            FRAGS+=("${f_file}")
          done
        done
        # Lane-local sur-rides (optional; the THP=never pin MOVED to the
        # image twins per the 13:05 arbitration) — an empty tree adds nothing.
        for lane in "${LANE_KCFG}"/*.cfg; do
          FRAGS+=("${lane}")
        done
      else
        # arm64 lane: no x86 GPU sets; the arm64 flavour + common fragments
        # come from the same engine export as the x86 ones.
        [[ -s "${KCFG_SHARED}/${KERNEL_ARCH_LEVEL}.cfg" ]] && \
          FRAGS+=("${KCFG_SHARED}/${KERNEL_ARCH_LEVEL}.cfg")
        [[ -s "${LANE_KCFG}/arm64-common.cfg" ]] && FRAGS+=("${LANE_KCFG}/arm64-common.cfg")
        for lane in "${LANE_KCFG}"/*.cfg; do
          FRAGS+=("${lane}")
        done
      fi
      shopt -u nullglob

      # ONE-MODULE ABI (owner 05/11 midi, alignment (a)): the -pve suffix
      # LEAVES the kernel release. The two lanes of the same mainline series
      # now carry the IDENTICAL release string (7.2.15-<x64vN>-xanmod1) so
      # ONE module build (the shared kernel_build_module helper) loads on
      # both. The -pve identity survives in the PACKAGING only (the PVE repo,
      # the lane's docs and the module-pair deb names). Old -pve kernels of
      # the same release string keep their own ABI (modversions) and stay
      # behind: never install the new pair beside them.
      unset LOCALVERSION

      if [[ "${KERNEL_ARCH}" = "x86_64" ]]; then
        # ONE flavour per variant (KERNEL_ARCH_LEVEL). KCFLAGS carries the
        # microarch (-march=x86-64-vN). The lane sur-rides are merged last so
        # NEVER always wins over the shared fragment's ALWAYS pin.
        kernel_merge_config "${SRCDIR}" "${FRAGS[@]}"
        # KLP guard (doctrine non-modifiable, remains): the objtool
        # klp-checksum tool is not built unless the merged config asks for
        # it. LOCALVERSION alignment above: the release is the plain
        # 7.2.15-<x64vN>-xanmod1 — the debian lane's exact string (proven on
        # the published pair module's vermagic), no env suffix anywhere.
        grep -q '^CONFIG_KLP_BUILD=y' "${SRCDIR}/.config" \
          || KERNEL_MAKE_ARGS="ARCH_HAS_KLP=n"
        KCFLAGS=$(kernel_flavour_kcflags "${KERNEL_ARCH_LEVEL}")
        kernel_build_debs "${SRCDIR}" bindeb-pkg "${KCFLAGS}"
      else
        # arm64 flavours: ONE kernel per flavour, cross-compiled (no gate, KERNEL FINAL v2).
        make -C "${SRCDIR}" defconfig
        [[ -s "${LANE_KCFG}/arm64-common.cfg" ]] && \
          FRAGS+=("${LANE_KCFG}/arm64-common.cfg")
        kernel_merge_config "${SRCDIR}" "${FRAGS[@]}"
        KCFLAGS=$(kernel_flavour_kcflags "${KERNEL_ARCH_LEVEL}")
        kernel_build_debs "${SRCDIR}" bindeb-pkg "${KCFLAGS}"
      fi

      # make deb-pkg/bindeb-pkg writes the debs one directory above the tree.
      cp "$(dirname "${SRCDIR}")"/*.deb /debs/
      # PUBLISH the headers tree of the flavour for the module builders
      # (owner 2026-11-04 OOB: the vanilla lane builds NO NVIDIA modules —
      # it must ship the linux-headers deb of the kernel-pve plus the FULL
      # Module.symvers, the exact ABI contract the single module builder
      # (debian-bootc) compiles the pairs against, downloaded from the
      # published Pages artifact at ITS build). bindeb-pkg emits the
      # linux-headers deb whenever loadable-module support is in the merged
      # config; the symvers file is INJECTED into that deb under
      # /usr/lib/linux-kernel-build/ (the same layout the kernel deb carries
      # on the debian lane), so the builder fetches ONE artifact per tree.
      HDR_DEB=$(find "$(dirname "${SRCDIR}")" -maxdepth 1 \
        -name "linux-headers-*${KERNEL_ARCH_LEVEL}*.deb" ! -name '*-all*' | head -1)
      test -n "${HDR_DEB}" \
        || { echo "ERROR: no linux-headers deb of ${KERNEL_ARCH_LEVEL} published" >&2; exit 1; }
      SYMVERS="${SRCDIR}/Module.symvers"
      test -s "${SYMVERS}" \
        || { echo "ERROR: the tree carries no Module.symvers for the headers deb" >&2; exit 1; }
      HDR_STAGE=$(mktemp -d /tmp/hdr-inject.XXXXXX)
      dpkg-deb -R "${HDR_DEB}" "${HDR_STAGE}/pkg"
      mkdir -p "${HDR_STAGE}/pkg/usr/lib/linux-kernel-build"
      cp "${SYMVERS}" "${HDR_STAGE}/pkg/usr/lib/linux-kernel-build/Module.symvers"
      ( cd "${HDR_STAGE}/pkg" && \
        find usr/lib/linux-kernel-build -type f | xargs md5sum | sed 's|usr/|/usr/|' \
        >> DEBIAN/md5sums )
      dpkg-deb --build "${HDR_STAGE}/pkg" "${HDR_DEB}"
      rm -rf "${HDR_STAGE}"

      # THE NVIDIA PAIR (owner 04/11 OOB: ONE kernel-modules build per repo
      # that ships a kernel — the LOGIC stays the engine's shared helpers).
      # The vanilla lane compiles the NVIDIA open modules against ITS OWN
      # prepared tree (SYSSRC = the live SRCDIR: kbuild, .config and
      # Module.symvers are all local — no headers-deb download), and
      # publishes the pair beside the kernel it is bound to. amd64 only.
      if [ "$(dpkg --print-architecture)" = "amd64" ]; then
        NVIDIA_OPEN_TAG="595.104.02"
        rm -rf /build/nvidia-open
        git clone --quiet --depth=1 --branch "${NVIDIA_OPEN_TAG}" \
          https://github.com/NVIDIA/open-gpu-kernel-modules.git /build/nvidia-open
        test -d /build/nvidia-open/kernel-open \
          || { echo "ERROR: nvidia-open has no kernel-open tree" >&2; exit 1; }

        GPU_NVIDIA_YML="${CI_KERNEL_SHARED}/patches-gpu/nvidia.yml"
        [[ -f "${GPU_NVIDIA_YML}" ]] \
          || { echo "ERROR: engine patches-gpu/nvidia.yml missing" >&2; exit 1; }
        [[ -n "${KERNEL_ARCH_LEVEL:-}" ]] \
          || { echo "ERROR: KERNEL_ARCH_LEVEL missing (flavour = the pair suffix)" >&2; exit 1; }
        # The kernel release string as packaged: real version + LOCALVERSION
        # (the flavour suffix the image deb name and /lib/modules use).
        IMG_DEB=$(find /debs -maxdepth 1 -name "linux-image-*${KERNEL_ARCH_LEVEL}*.deb" ! -name "*dbg*" | head -1)
        test -n "${IMG_DEB}" \
          || { echo "ERROR: no linux-image deb of ${KERNEL_ARCH_LEVEL} built" >&2; exit 1; }
        KVER=$(dpkg-deb -f "${IMG_DEB}" Package | sed 's/^linux-image-//')
        PATCHES_SERIES="${KVER%%-*}"
        export PATCHES_SERIES
        kernel_apply_patches "${GPU_NVIDIA_YML}" "amd64" "${NVIDIA_OPEN_TAG}" "/build/nvidia-open"
        unset PATCHES_SERIES

        # ONE-module build (owner 05/11 midi points c/d): the build and the
        # deb assembly move to the shared kernel_helpers — same helper as
        # the zfs pair, ONE module ABI for both lanes of the release.
        kernel_module_run_build "${SRCDIR}" /build/nvidia-open \
          'make ARCH="x86_64" -C /build/nvidia-open -j"$(nproc)" modules'
        NV_KOS=()
        shopt -s nullglob
        for nko in /build/nvidia-open/kernel-open/*.ko /build/nvidia-open/*.ko; do
          NV_KOS+=("${nko}")
        done
        shopt -u nullglob
        test "${#NV_KOS[@]}" -ge 1 \
          || { echo "ERROR: nvidia-open produced no nvidia*.ko" >&2; exit 1; }

        # Depends LOOSENED (owner midi point e): no flavour pin, no version
        # pin — both lanes' kernel packages of the same aligned release
        # satisfy it (the deb is consumed by both).
        kernel_modules_deb \
          "linux-modules-nvidia-pve-${KERNEL_ARCH_LEVEL}" "595.104.02-1" "${KVER}" \
          "drivers/video" \
          "linux-image-${KVER} | daemoncores-kernel-${KVER}" \
          "PVE NVIDIA open kernel modules pair (flavour ${KERNEL_ARCH_LEVEL})\n The NVIDIA open-gpu-kernel-modules ${NVIDIA_OPEN_TAG}"
          " compiled against the ${KVER} tree of this repo (the ABI pair);"
          " loader policy and GSP knobs live in the gpu-set debs." \
          "${NV_KOS[@]}"
      fi

      # Free the ~10 GB source tree now that the debs are in /debs.
      rm -rf "${SRCDIR}" /build
      ls -la /debs
    # deb-glob is NOT {variant}-substituted by expand.jq (only variant-source
    # and variant-deps are): every variant carries its own literal glob.
    deb-glob: "linux-*x64v1*"
    variants:
      x64v1:
        when:
          arch: amd64
      x64v2:
        when:
          arch: amd64
        deb-glob: "linux-*x64v2*"
      x64v3:
        when:
          arch: amd64
        deb-glob: "linux-*x64v3*"
      x64v4:
        when:
          arch: amd64
        deb-glob: "linux-*x64v4*"
      armv8.0:
        when:
          arch: arm64
        env:
          KERNEL_ARCH: arm64
        deb-glob: "linux-*armv8.0*"
      armv8.2-lse:
        when:
          arch: arm64
        env:
          KERNEL_ARCH: arm64
        deb-glob: "linux-*armv8.2-lse*"
      armv9-sve2:
        when:
          arch: arm64
        env:
          KERNEL_ARCH: arm64
        deb-glob: "linux-*armv9-sve2*"
  - name: source-build
    variant-env: PKG
    variant-source: "{variant}-src"
    env:
      HELPERS_VER: 6
    build: |
      deb_source_build "${PKG}" "${UP_COMMIT}" "${SRC_VER}" "${PKG}-src" pve-cluster libpve-cluster-api-perl
    deb-glob: "{variant}_*"
    variants:
      pve-cluster:
        env:
          PKG: pve-cluster
          UP_COMMIT: 66c87e0e7587a247f879f6f59e3bb5f3dd008e1f
          SRC_VER: 9.1.7.1+bootc1

  # ZFS MODULE — STANDALONE BUILDER (owner order 05/11 08:5x + correction
  # 08:57). The unified mainline 7.2 tree carries no zfs module (the PVE
  # packaging builds it from the zfsonlinux submodule, OUT of this build
  # path): the pools on the PVE hosts are intact, only the kernel modules
  # miss. One entry, NO kernel recompile, NO DKMS: the builder downloads
  # the flavour's published linux-headers deb from this repo's APT on
  # Pages (module-ready tree: auto.conf/autoconf.h/utsrelease +
  # Module.symvers), builds the OpenZFS modules against it and ships
  # zfs-module-pve-<flavour>. Dispatched ALONE via the pipeline's
  # only_deb filter (= zfs-module-pve) — the kernel entry is untouched.
  # Version rule (owner 08:5x + correction 08:56/08:57 + BUILD fail proof):
  # the tag must support THE RESOLVED KERNEL first, match the userspace
  # second. zfs-2.3.4 hard-rejects the 7.2.15 tree (its META Linux-Maximum
  # = 6.16 — configure3 run, live), so ZFS_TAG pins zfs-2.4.4 (Linux-Maximum
  # = 7.2, first release covering the 7.x PVE line; master is 7.3 but
  # rolling). USERSPACE doctrine: the host zfsutils-linux stays 2.3.x-pve1
  # (PVE trixie index) — a module NEWER than the utils is the tolerated
  # direction (OpenZFS ABI: userland ioctls are backward compatible across
  # the 2.3 → 2.4 major), the REVERSE is not; the control floors zfsutils
  # only at 2.3~ and the host utils are NOT upgraded. On the host return,
  # `zfs version` via the relay re-checks the pair and the tag is repinned
  # only for a NEWER-utils mismatch. NO DKMS. Dispatched ALONE via the
  # pipeline's only_deb filter (= zfs-module-pve) — the VER 9 kernel entry
  # (and its content hash / cache) is untouched.
  - name: zfs-module-pve
    env:
      ZFS_TAG: "zfs-2.4.4"
      ZFS_DEB_VER: "2.4.4-1"
    build: |
      FLAV="${VARIANT}"
      test -n "${FLAV}" \
        || { echo "ERROR: zfs-module-pve needs a flavour variant" >&2; exit 1; }
      mkdir -p /build /debs

      # The flavour's published headers deb, resolved from THIS repo's APT
      # index (PAGES_URL — the same base build-deb.sh derives; trixie is
      # the dist bootc-debs-end publishes). No version committed here: the
      # newest build of the flavour wins, and the ALIGNED (plain, no -pve)
      # release string is preferred — the one-module ABI deb must be built
      # on the plain tree (owner 05/11 midi); the legacy -pve headers are
      # only a transition fallback and keep their old modversions ABI.
      BASE="https://daemoncores.github.io/$(printf '%s' "${GITHUB_REPOSITORY:?}" | cut -d/ -f2 | tr '[:upper:]' '[:lower:]')"
      test -z "${PAGES_URL:-}" || BASE="${PAGES_URL%/}"
      IDX="${BASE}/dists/trixie/main/binary-amd64/Packages"
      curl -fsSL "${IDX}" -o /build/Packages \
        || { echo "ERROR: cannot read the APT index ${IDX}" >&2; exit 1; }
      # Prefer the ALIGNED (plain, no -pve) headers when both spellings
      # exist; otherwise fall back to the legacy -pve tree (transition only).
      HDR_NAME=$(grep '^Package: linux-headers-' /build/Packages \
        | sed 's/^Package: //' \
        | grep -- "-${FLAV}-xanmod1\$" | sort -rV | head -1)
      test -n "${HDR_NAME}" \
        || HDR_NAME=$(grep '^Package: linux-headers-' /build/Packages \
          | sed 's/^Package: //' \
          | grep -- "-${FLAV}-xanmod1-pve\$" | sort -rV | head -1)
      echo "zfs-module-pve: headers selected: ${HDR_NAME:-<none>}"
      test -n "${HDR_NAME}" \
        || { echo "ERROR: no linux-headers for flavour ${FLAV} in the APT index" >&2; exit 1; }
      curl -fsSL "${BASE}/$(sed -n "s/^Filename: //p" /build/Packages \
        | grep -F "${HDR_NAME}_" | head -1)" -o /build/headers.deb \
        || { echo "ERROR: cannot download ${HDR_NAME}" >&2; exit 1; }
      KVER=$(dpkg-deb -f /build/headers.deb Package | sed 's/^linux-headers-//')
      echo "zfs-module-pve: building against ${KVER} (${HDR_NAME})"

      apt-get update >/dev/null
      apt-get install -y --no-install-recommends \
        autoconf automake libtool build-essential bc libelf-dev >/dev/null

      rm -rf /build/sys && mkdir -p /build/sys
      dpkg-deb -x /build/headers.deb /build/sys
      SYS="$(find /build/sys -maxdepth 3 -type d -name "linux-headers-${KVER}" | head -1)"
      test -n "${SYS}" \
        || { echo "ERROR: no linux-headers-${KVER} tree in the deb" >&2; exit 1; }
      test -s "${SYS}/Module.symvers" && test -s "${SYS}/Makefile" \
        || { echo "ERROR: ${SYS} is not a module-ready headers tree" >&2; exit 1; }
      grep -qF "\"${KVER}\"" "${SYS}/include/generated/utsrelease.h" \
        || { echo "ERROR: headers tree UTS_RELEASE != ${KVER}" >&2; exit 1; }
      # ABI guard (owner midi): the pair must NOT carry modversions CRCs —
      # the aligned tree was merged with CONFIG_MODVERSIONS=n (modules.cfg).
      grep -q '^CONFIG_MODVERSIONS=y' "${SYS}/.config" \
        && { echo "ERROR: ${KVER} tree carries MODVERSIONS — one-module ABI broken" >&2; exit 1; }

      ZFS_TAG="${ZFS_TAG:-zfs-2.4.4}"
      rm -rf /build/openzfs
      git clone --quiet --depth=1 --branch "${ZFS_TAG}" \
        https://github.com/openzfs/zfs.git /build/openzfs
      test -f /build/openzfs/zfs.release.in \
        || { echo "ERROR: openzfs clone ${ZFS_TAG} is not an OpenZFS tree" >&2; exit 1; }
      ( cd /build/openzfs && ./autogen.sh ) >/dev/null 2>&1
      ( cd /build/openzfs && ./configure --with-config=kernel \
          --with-linux="$(readlink -e "${SYS}")" \
          --with-linux-obj="$(readlink -e "${SYS}")" ) \
        || { echo "ERROR: openzfs configure against ${SYS} failed" >&2; exit 1; }
      export ARCH=x86_64
      # MODULE-ONLY target: the default `make` chains scripts/zfs-tests.sh -c
      # after the modules and fails off the module (proven make5). 2.x
      # merges the submodules: EXACTLY zfs.ko (zavl/znvpair/zunicode/
      # zcommon/zpios merged) + spl.ko; the build/ .ko are kbuild probes.
      kernel_module_run_build "${SYS}" /build/openzfs/module \
        'make -C /build/openzfs/module -j"$(nproc)"'
      test -s /build/openzfs/module/zfs.ko \
        && test -s /build/openzfs/module/spl.ko \
        || { echo "ERROR: no zfs.ko/spl.ko after the module build" >&2; exit 1; }

      ZFS_VER="${ZFS_DEB_VER:-2.4.4-1}"
      # Depends LOOSENED (owner midi point e): the release string carries the
      # flavour; the exact pin is gone and BOTH lanes' kernel packages
      # satisfy it (the release is identical across the lanes now).
      kernel_modules_deb \
        "zfs-module-pve-${FLAV}" "${ZFS_VER}" "${KVER}" "zfs" \
        "linux-image-${KVER} | daemoncores-kernel-${KVER}" \
        "PVE OpenZFS kernel modules (flavour ${FLAV})\n The OpenZFS ${ZFS_TAG} modules"
        " built against the published linux-headers deb of the ${KVER} tree"
        " (the ABI pair); one module ABI for both lanes of the release." \
        /build/openzfs/module/zfs.ko /build/openzfs/module/spl.ko
      rm -rf /build/sys /build/openzfs
    deb-glob: "zfs-module-pve-{variant}*"
    variants:
      x64v3:
        when:
          arch: amd64
      x64v1:
        when:
          arch: amd64
      x64v2:
        when:
          arch: amd64
      x64v4:
        when:
          arch: amd64
