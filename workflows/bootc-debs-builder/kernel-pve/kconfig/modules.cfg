# Lane sur-ride (2026-11-04): the external NVIDIA modules (the
# linux-modules-nvidia-pve pair of the same build) need loadable-module
# support in the merged kernel config — the defconfig fallback path (the PVE
# packaging tree carries no base .config) does not guarantee it, and the
# pairing stage refuses to build against a CONFIG_MODULES=n tree.
# Merged LAST, this wins over every earlier fragment.
CONFIG_MODULES=y
CONFIG_MODULE_UNLOAD=y
# CONFIG_KLP (2026-11-04, proven failures 41925723483 + 41928110872): the
# packaging master (7.0.14-27) carries an objtool klp-checksum.c that does
# NOT compile against the 7.0.14-28 tree (is_cold_func/is_alias_sym/
# decode_file/free_insns implicit — the rolling packaging and kernel
# versions drift apart). Livepatching is meaningless on a PVE host running
# the LXC compute profile anyway: KLP off removes the tool from the objtool
# build entirely, so the mismatch dies with it.
CONFIG_KLP=n
CONFIG_KLP_BUILD=n
