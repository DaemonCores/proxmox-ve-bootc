expand-hosts

# The system resolver points at dnsmasq itself (127.0.0.1, published by
# openresolv). dnsmasq must therefore NOT take its own upstreams from
# /etc/resolv.conf — that would resolve to 127.0.0.1 and loop back into dnsmasq.
# openresolv collects the `dns-nameservers` from
# /etc/network/interfaces — written (excluding the local 127.0.0.1 entry) to
# /run/dnsmasq/resolv.conf; dnsmasq forwards upstream queries to those. The
# interfaces file itself is written at install time (bootc-installer, network
# stage). The ddns bridge/domain/dhcp-range layout lives in the DaemonCores-VE
# fork image; this vanilla file ships the resolver chain only.
resolv-file=/run/dnsmasq/resolv.conf