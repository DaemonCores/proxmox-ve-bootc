# pmxcfs refuses to start until the node name resolves to a NON-loopback
# address: the 127.0.1.1 bootstrap line only covers the pre-lease window.
# The real entry is rendered by domain-set (networking ExecStartPost reads
# /etc/hosts.tpl) — so pve-cluster must not race networking: after
# network-online, the rendered /etc/hosts is in place before pmxcfs forks.
[Unit]
Wants=network-online.target
After=network-online.target
# And do not just follow network-online (which completes without the WAN
# lease): pmxcfs forks only once the node name actually resolves to a
# non-loopback address, i.e. after the rendered /etc/hosts entry lands.
# ExecStartPre polls with a 90 s cap and fails loud past it.
[Service]
ExecStartPre=/usr/libexec/pve-node-resolve-wait
